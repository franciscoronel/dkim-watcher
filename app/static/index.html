<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DKIM Watcher</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>DKIM Watcher - <span id="record-count">loading...</span></h1>
      <div class="toolbar">
        <a href="/selectors/new" class="btn btn-primary">Add New Selector</a>
        <button id="manual-check" class="btn btn-secondary">Run DKIM Check</button>
        <button id="export-csv" class="btn btn-secondary">Export CSV</button>
      </div>
    </header>

    <main>
      <table id="table">
        <thead>
          <tr>
            <th class="sortable" data-sort-col="0" onclick="sortTable(0)" title="Sort by domain">Domain <span class="sort-indicator"></span></th>
            <th>Selector</th>
            <th>TXT Record</th>
            <th>Last Checked</th>
            <th class="sortable" data-sort-col="4" onclick="sortTable(4)" title="Sort by days unchanged">Unchanged For <span class="sort-indicator"></span></th>
            <th class="sortable" data-sort-col="5" onclick="sortTable(5)" title="Sort by key length">Key Length <span class="sort-indicator"></span></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data populated by JavaScript -->
        </tbody>
      </table>
    </main>
  </div>

  <script>
    // Sort state lives in the table's dataset so it survives a data refresh.
    // sortTable() toggles the requested column; applySort() reorders the rows
    // and paints the header indicators. Global scope for the <th> onclicks.
    function sortTable(n) {
      const table = document.getElementById('table');
      const asc = table.dataset.sortCol !== n.toString() || table.dataset.sortAsc !== 'true';
      table.dataset.sortCol = n.toString();
      table.dataset.sortAsc = asc ? 'true' : 'false';
      applySort();
    }

    function applySort() {
      const table = document.getElementById('table');
      const tbody = table.tBodies[0];
      const col = table.dataset.sortCol;

      // No active sort: show the neutral hint on every sortable header.
      const sortableThs = Array.from(document.querySelectorAll('th.sortable'));
      sortableThs.forEach(th => {
        const span = th.querySelector('.sort-indicator');
        if (span) span.textContent = '';
        th.classList.remove('sorted');
      });
      if (col === undefined) return;

      const n = parseInt(col, 10);
      const asc = table.dataset.sortAsc === 'true';

      // Get numeric value from cell text (handles "2048 bit", "0 days", etc.)
      const getNum = (text) => {
        const m = text.match(/^(-?\d+)/);
        return m ? parseFloat(m[1]) : NaN;
      };

      const rows = Array.from(tbody.rows);
      rows.sort((a, b) => {
        const aText = a.cells[n].textContent.trim();
        const bText = b.cells[n].textContent.trim();
        const aNum = getNum(aText);
        const bNum = getNum(bText);
        let cmp;
        if (!isNaN(aNum) && !isNaN(bNum)) {
          cmp = aNum - bNum;
        } else {
          cmp = aText.localeCompare(bText);
        }
        if (cmp === 0 && n === 0) {
          cmp = a.cells[1].textContent.trim().localeCompare(b.cells[1].textContent.trim());
        }
        return asc ? cmp : -cmp;
      });
      rows.forEach(r => tbody.appendChild(r));

      // Paint the active header. Match on the data-sort-col attribute: a column
      // index is NOT an index into the .sortable node list (Domain=0 happened to
      // match, Unchanged For=4 and Key Length=5 did not), which is why only
      // Domain ever showed an arrow.
      const activeTh = sortableThs.find(th => th.dataset.sortCol === col);
      const activeSpan = activeTh ? activeTh.querySelector('.sort-indicator') : null;
      if (activeSpan) activeSpan.textContent = asc ? ' ▲' : ' ▼';
      if (activeTh) activeTh.classList.add('sorted');
    }

    async function load() {
      // Load data
      try {
        const res = await fetch('/dkim?t=' + Date.now());
        const data = await res.json();
        const tbody = document.querySelector('#table tbody');
        tbody.innerHTML = '';

        // Update record count
        const countEl = document.getElementById('record-count');
        if (countEl) {
          const word = data.length === 1 ? 'selector record' : 'selector records';
          countEl.textContent = `${data.length} ${word}`;
        }

        data.forEach(r => {
          const tr = document.createElement('tr');
          if (r.changed) tr.classList.add('changed');

          // Build cells with textContent / setAttribute — never innerHTML with
          // interpolated data. r.txt comes from a public DNS TXT record, so
          // anyone controlling a monitored domain could otherwise inject markup.
          const cell = (cls) => {
            const td = document.createElement('td');
            if (cls) td.className = cls;
            return td;
          };

          const tdDomain = cell();
          tdDomain.textContent = r.domain;
          tr.appendChild(tdDomain);

          const tdSelector = cell();
          tdSelector.textContent = r.selector;
          tr.appendChild(tdSelector);

          const tdTxt = cell('txt-cell');
          tdTxt.setAttribute('title', r.txt || '');
          if (r.txt) {
            tdTxt.textContent = r.txt;
          } else {
            const muted = document.createElement('span');
            muted.className = 'muted';
            muted.textContent = 'None';
            tdTxt.appendChild(muted);
          }
          tr.appendChild(tdTxt);

          const tdChecked = cell();
          tdChecked.textContent = new Date(r.last_checked).toLocaleString();
          tr.appendChild(tdChecked);

          const tdUnchanged = cell();
          tdUnchanged.textContent = `${r.unchanged_for || 0} days`;
          tr.appendChild(tdUnchanged);

          const tdKey = cell();
          tdKey.textContent = r.key_length ? `${r.key_length} bit` : '-';
          tr.appendChild(tdKey);

          const tdActions = cell('actions');
          const mkBtn = (label, cls, title, handler) => {
            const b = document.createElement('button');
            b.className = `btn ${cls}`;
            b.textContent = label;
            b.title = title;
            b.addEventListener('click', handler);
            return b;
          };
          tdActions.appendChild(mkBtn('Edit', 'btn-secondary', 'Edit', () => editSelector(r.domain, r.selector)));
          tdActions.appendChild(mkBtn('Delete', 'btn-danger', 'Delete', () => deleteSelector(r.domain, r.selector)));
          tr.appendChild(tdActions);

          tbody.appendChild(tr);
        });

        // Re-apply the user's current sort to the freshly loaded rows so the
        // arrow and the row order stay consistent after a refresh.
        applySort();
      } catch (err) {
        console.error('Failed to load DKIM records:', err);
      }
    }

    async function deleteSelector(domain, selector) {
      if (confirm(`Are you sure you want to delete ${domain} (${selector})?`)) {
        try {
          const res = await fetch(`/selectors/${domain}/${selector}`, { method: 'DELETE' });
          if (res.ok) {
            load();
          } else {
            alert('Failed to delete selector.');
          }
        } catch (err) {
          alert('Error during deletion.');
        }
      }
    }

    async function editSelector(domain, selector) {
      const newDomain = prompt("Enter new domain:", domain);
      const newSelector = prompt("Enter new selector:", selector);
      if (newDomain && newSelector) {
        try {
          const res = await fetch(`/selectors/${domain}/${selector}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ domain: newDomain, selector: newSelector })
          });
          if (res.ok) {
            load();
          } else {
            alert('Failed to update selector.');
          }
        } catch (err) {
          alert('Error during update.');
        }
      }
    }

    // Run DKIM check on demand
    document.getElementById('manual-check').addEventListener('click', async () => {
      const btn = document.getElementById('manual-check');
      btn.disabled = true;
      btn.textContent = 'Checking...';
      try {
        const res = await fetch('/dkim/check', { method: 'POST' });
        const data = await res.json();
        alert(`DKIM check complete (${data.time || 'n/a'}).`);
        load();
      } catch (err) {
        alert('DKIM check failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run DKIM Check';
      }
    });

    // Export CSV: fetch /dkim/export/csv and trigger a browser download
    document.getElementById('export-csv').addEventListener('click', async () => {
      const btn = document.getElementById('export-csv');
      btn.disabled = true;
      btn.textContent = 'Exporting...';
      try {
        const res = await fetch('/dkim/export/csv');
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dkim_records.csv';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (err) {
        alert('CSV export failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Export CSV';
      }
    });

    load();
  </script>
</body>
</html>
